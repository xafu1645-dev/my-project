<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจสอบสิทธิ์ลูกค้า</title><style>body{margin:0;background:#f2f5f9;color:#172437;font-family:Tahoma,Arial,sans-serif}header{background:#14243a;color:white;padding:22px 16px}main{max-width:680px;margin:22px auto;padding:0 14px}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:22px}.center{text-align:center}.status{display:inline-block;border-radius:999px;padding:7px 12px;font-weight:bold;background:#fff0d0;color:#815500}.approved{background:#e6f6ed;color:#176a40}.rejected{background:#fde8e8;color:#9f2d2d}.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #e7ebf1}.row span{color:#64748b}.row strong{text-align:right;overflow-wrap:anywhere}button{padding:11px 15px;border:0;border-radius:8px;background:#2457a7;color:white;font-weight:bold;cursor:pointer}.muted{color:#64748b;font-size:13px;line-height:1.6}@media print{header,.no-print{display:none}body{background:white}.card{border:0}}</style></head><body><header><h1>ตรวจสอบข้อมูลและสิทธิ์ลูกค้า</h1><p>ตรวจสอบข้อมูลจากฐานข้อมูลระบบ</p></header><main><div class="card" id="content"><p class="center">กำลังตรวจสอบข้อมูล...</p></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusName=s=>s==='approved'?'ยืนยันสิทธิ์แล้ว':s==='rejected'?'ไม่ผ่านการยืนยัน':'รอตรวจสอบ';
async function run(){const t=new URLSearchParams(location.search).get('t'),el=document.getElementById('content');if(!t){el.innerHTML='<h2>ไม่พบรหัสอ้างอิง</h2><p>กรุณาสแกน QR Code อีกครั้ง</p>';return}try{const r=await fetch('/api/public/verify/'+encodeURIComponent(t)),d=await r.json();if(!r.ok)throw Error(d.error||'ตรวจสอบไม่ได้');const c=d.customer,cl=c.rightsStatus==='approved'?'approved':c.rightsStatus==='rejected'?'rejected':'';el.innerHTML='<div id="slip"><h2 class="center">สลิปตรวจสอบสิทธิ์ลูกค้า</h2><p class="center"><span class="status '+cl+'">'+esc(statusName(c.rightsStatus))+'</span></p><div class="row"><span>ชื่อลูกค้า</span><strong>'+esc(c.firstName)+'</strong></div><div class="row"><span>นามสกุลลูกค้า</span><strong>'+esc(c.lastName)+'</strong></div><div class="row"><span>เลขโควต้าลูกค้า</span><strong>'+esc(c.quotaNo)+'</strong></div><div class="row"><span>เลขที่ใบจองโควต้า</span><strong>'+esc(c.bookingNo||'-')+'</strong></div><div class="row"><span>วันที่ใบจอง</span><strong>'+esc(c.bookingDate||'-')+'</strong></div><div class="row"><span>โครงการ / รายการ</span><strong>'+esc(c.projectName||'-')+'</strong></div><div class="row"><span>รหัสอ้างอิง</span><strong>'+esc(c.reference)+'</strong></div><p class="center muted">ตรวจสอบเมื่อ '+esc(new Date().toLocaleString('th-TH'))+'</p><p class="center muted">ข้อมูลนี้เป็นสถานะในระบบ ณ เวลาที่ตรวจสอบ ไม่ใช่เอกสารรับรองจากหน่วยงานภายนอก</p></div><div class="center no-print" style="margin-top:18px"><button onclick="window.print()">พิมพ์ / บันทึก PDF</button></div>'}catch(e){el.innerHTML='<h2>ตรวจสอบไม่สำเร็จ</h2><p>'+esc(e.message)+'</p><p class="muted">โปรดติดต่อเจ้าหน้าที่</p>'}}run();
</script></body></html>
