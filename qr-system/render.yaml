services:
  - type: web
    name: qr-quota-customer-system
    runtime: node
    plan: starter
    rootDir: qr-system
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: qr-quota-data
      mountPath: /opt/render/project/src/qr-system
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
